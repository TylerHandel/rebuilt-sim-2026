# Publish the simulator to GitHub Pages on every push to main (and on demand from the Actions tab).
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # just the game: the page, its code and styles, and the CAD models (three.js and Rapier
      # come from a CDN)
      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html js css cad _site/
      # the shared neural networks (js/nn/shared/*.json), listed for the game's Neural net menu
      - name: List the shared neural networks
        run: node tools/nn/share-index.mjs _site/js/nn/shared
      # GitHub Pages lets browsers keep files for 10 minutes, so after a deploy a reload could mix
      # new and old code. Tagging every code file with this commit makes each deploy's files new
      # URLs, fetched fresh.
      - name: Tag code files with the version
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#(from '\./[^']+\.js)'#\1?v=$V'#g; s#(import\('\./[^']+\.js)'\)#\1?v=$V')#g" _site/js/*.js
          sed -i -E "s#(src=\"js/main\.js)\"#\1?v=$V\"#; s#(href=\"css/style\.css)\"#\1?v=$V\"#" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
